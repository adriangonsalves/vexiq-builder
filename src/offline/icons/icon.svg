<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The app icon: the toolbar's red VEX IQ badge on the panel colour (openspec offline-app) -->
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef4444" />
      <stop offset="1" stop-color="#dc2626" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#111827" />
  <rect x="64" y="160" width="384" height="192" rx="36" fill="url(#badge)" />
  <text x="256" y="256" dy="0.35em" text-anchor="middle" fill="#fff" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="104" letter-spacing="4">VEX IQ</text>
</svg>
